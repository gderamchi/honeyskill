<text x="70" y="770" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#102F4C" text-anchor="start">Same verdicts on all 12 scored pairs. This corpus shows no classification advantage.</text>
<text x="70" y="812" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#35546E" text-anchor="start">Shared scoring: 12/12 pairs. Unscored: 0. Resource totals include all attempted rows and returned API usage.</text>
<text x="70" y="863" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#35546E" text-anchor="start">gpt-6-luna, reasoning none, temperature 0. Fuji fork block 59,275,449. 177 local transfers and 37 violations.</text>
<text x="70" y="903" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526574" text-anchor="start">12 frozen synthetic skills, six tasks with and without each skill. Fresh paired execution. Fork startup 0.23 s excluded from method timings.</text>
<text x="70" y="944" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#526574" text-anchor="start">Different compute budgets. One run on this corpus does not establish general superiority or safety.</text>
<text x="70" y="984" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526574" text-anchor="start">Author labels describe intent. The behavioral verdict describes observed recipients. Trusted-contact swaps remain outside the oracle.</text>
<text x="70" y="1024" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526574" text-anchor="start">Actual model calls and transfers on a local fork only. No real wallets or public transactions. Tokens are returned usage, not verified billing.</text>
