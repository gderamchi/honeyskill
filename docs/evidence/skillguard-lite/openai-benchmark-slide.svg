<text x="80" y="940" font-family="Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#35546E">Actual model calls and local fork transfers. 12 frozen synthetic fixtures. 43 violations across 181 local transfers.</text>
